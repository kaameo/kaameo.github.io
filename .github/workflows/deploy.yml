name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # PR(주로 Dependabot)은 빌드만 확인하고 배포하지 않는다.
  pull_request:
    branches: [main]
  workflow_dispatch:

# 기본은 읽기만 허용한다. 배포 권한은 deploy 잡에만 준다.
permissions:
  contents: read

concurrency:
  # 배포는 순서대로 하나씩 하고, PR 빌드는 같은 PR의 이전 실행을 취소한다.
  group: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || 'pages' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # 태그는 옮겨질 수 있어서 커밋 SHA로 고정한다. 버전 올리기는 Dependabot이 한다.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      # 설치하기 전에 lockfile만 보고 감사한다.
      # 알려진 high 이상 취약점이나 악성 패키지가 있으면 그 코드를 받기 전에 멈춘다.
      - run: pnpm audit --audit-level high
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
        env:
          NEXT_PUBLIC_GA_MEASUREMENT_ID: ${{ secrets.NEXT_PUBLIC_GA_MEASUREMENT_ID }}
      - if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: out

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
